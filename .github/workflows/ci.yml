name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        net: [nnue_stub, embedded_nnue_768x32, embedded_nnue_768x256]
        movelist: [dynamic, linked]

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc make libcunit1-dev

      - name: Build
        run: make MOVELIST=${{ matrix.movelist }} NET=${{ matrix.net }} re

      - name: Self-test (perft + NNUE consistency)
        run: ./chess --selftest

      - name: UCI smoke test
        run: |
          out=$(printf 'uci\nisready\nposition startpos\ngo depth 5\nquit\n' | ./chess)
          echo "$out"
          echo "$out" | grep -q uciok
          echo "$out" | grep -q readyok
          echo "$out" | grep -q '^bestmove'

      - name: Unit tests (CUnit)
        run: make MOVELIST=${{ matrix.movelist }} NET=${{ matrix.net }} test_re
